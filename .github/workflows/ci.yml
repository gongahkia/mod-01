name: MOD-01 CI/CD on Push

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full repository check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install native desktop libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Set up and build
        run: make setup

      - name: Run the full quality gate
        run: make check

  native-package:
    name: Native Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - name: Install native desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install workspace packages
        run: pnpm install --frozen-lockfile

      - name: Build native Studio and bundle its runtime
        run: pnpm native:package

      - name: Test native project and sprite operations
        run: cargo test -p mod01-native

      - name: Test native runtime process
        run: pnpm --dir packages/runtime exec vitest run src/native-host.test.ts

      - name: Package and launch a native game with its bundled Node
        run: node scripts/verify-native-game.mjs target/release/mod01-studio${{ runner.os == 'Windows' && '.exe' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: mod01-native-${{ matrix.os }}
          path: dist/mod01-native-*.tar.gz
