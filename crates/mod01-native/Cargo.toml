[package]
name = "mod01-native"
description = "Native desktop Studio for MOD-01"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mod01-studio"
path = "src/main.rs"

[dependencies]
base64.workspace = true
cpal = "0.18.2"
directories = "6.0.0"
dunce = "=1.0.5"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
gilrs = "0.11.0"
image = { workspace = true, features = ["png", "gif"] }
modl-core.workspace = true
rfd = "0.17.2"
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
